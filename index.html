<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>福星艦</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700&family=Noto+Serif+TC:wght@900&display=swap">
<style>
/* Layout: full-bleed 3D sea; stats and hull bar float along the top edge; steering and volley sit in the bottom thumb corners. Single committed look (deep-water night chart), so every color is explicit. */
:root {
  --ink: #05202b;
  --deep: #0b3a4d;
  --foam: #e9f6f7;
  --brass: #f2b632;
  --brass-dark: #5a3d08;
  --signal: #ff4d4d;
  --cyan: #35d0ff;
  --ok: #46e08a;
  --panel: rgba(4, 26, 36, 0.72);
  --line: rgba(233, 246, 247, 0.16);
  --display: 'Noto Serif TC', 'Songti TC', 'PMingLiU', serif;
  --body: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--ink);
  color: var(--foam);
  font-family: var(--body);
  font-size: 14px;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#app { position: relative; width: 100%; height: 100%; overflow: hidden; touch-action: none; background: #0e5f78; }
#app canvas { display: block; width: 100%; height: 100%; }
button { font: inherit; color: inherit; }

/* HUD */
#top {
  position: absolute; left: 0; right: 0; top: 0;
  padding-block: 12px 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 10px;
  pointer-events: none;
}
.row1 { display: flex; gap: 10px; align-items: stretch; justify-content: space-between; }
.stats { display: flex; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; backdrop-filter: blur(6px); }
.stat { background: var(--panel); padding: 6px 12px; min-width: 52px; display: flex; flex-direction: column; gap: 1px; }
.stat small { font-size: 11px; letter-spacing: 0.12em; color: rgba(233,246,247,0.62); }
.stat b { font-size: 18px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat.gold b { color: var(--brass); }
.btn-ghost {
  pointer-events: auto; cursor: pointer;
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  padding: 0 14px; min-height: 44px; backdrop-filter: blur(6px); letter-spacing: 0.1em;
}
.btn-ghost:focus-visible, .btn:focus-visible, #volley:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
.btns { display: flex; gap: 8px; }
.hull { display: flex; align-items: center; gap: 10px; max-width: 380px; }
.hexb { flex: none; width: 34px; height: 38px; background: var(--cyan); color: #04222e; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); display: grid; place-items: center; font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; }
.bars { flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.bar-hp, .bar-xp { height: 12px; border-radius: 6px; background: rgba(0,0,0,0.5); border: 1px solid var(--line); overflow: hidden; }
.bar-xp { height: 5px; border-radius: 3px; }
.bar-hp i, .bar-xp i { display: block; height: 100%; width: 100%; transform-origin: left center; transform: scaleX(1); }
.bar-hp i { background: linear-gradient(90deg, #2fc46e, var(--ok)); }
.bar-hp.low i { background: linear-gradient(90deg, #d93636, var(--signal)); }
.bar-xp i { background: var(--brass); transform: scaleX(0); }
#hp-text { font-size: 11px; letter-spacing: 0.1em; color: rgba(233,246,247,0.7); font-variant-numeric: tabular-nums; }

/* world labels */
#labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.lab { position: absolute; left: 0; top: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; will-change: transform; }
.lab .r { display: flex; align-items: center; }
.lab .hex { width: 22px; height: 25px; margin-right: -6px; z-index: 1; background: var(--cyan); color: #04222e; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); display: grid; place-items: center; font-size: 11px; font-weight: 700; }
.lab .bar { width: 64px; height: 8px; border-radius: 4px; background: rgba(0,0,0,0.55); overflow: hidden; border: 1px solid rgba(255,255,255,0.25); }
.lab .bar i { display: block; height: 100%; transform-origin: left center; }
.lab.foe .bar i { background: var(--signal); }
.lab.me .bar i { background: var(--ok); }
.lab .rw { display: flex; align-items: center; gap: 3px; font-size: 11px; font-weight: 700; color: var(--brass); text-shadow: 0 1px 2px rgba(0,0,0,0.7); font-variant-numeric: tabular-nums; }
.lab .coin { width: 9px; height: 9px; border-radius: 50%; background: var(--brass); box-shadow: inset 0 0 0 2px #b27d10; }
.arrow { position: absolute; left: 0; top: 0; width: 18px; height: 18px; background: var(--signal); clip-path: polygon(100% 50%, 0 0, 22% 50%, 0 100%); filter: drop-shadow(0 1px 2px rgba(0,0,0,0.6)); will-change: transform; }
.pop { position: absolute; left: 0; top: 0; translate: -50% -50%; font-weight: 700; font-size: 15px; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.8); animation: rise 0.8s ease-out forwards; font-variant-numeric: tabular-nums; }
.pop.hurt { color: #ff8a8a; }
@keyframes rise { from { opacity: 1; transform: translate(var(--x), var(--y)); } to { opacity: 0; transform: translate(var(--x), calc(var(--y) - 46px)); } }

/* controls */
#stick {
  position: absolute; width: 124px; height: 124px; border-radius: 50%;
  left: max(24px, env(safe-area-inset-left, 0px)); bottom: 44px;
  border: 2px solid rgba(233,246,247,0.38); background: rgba(4,26,36,0.28);
  pointer-events: none; opacity: 0.55; transition: opacity 0.2s;
}
#stick.on { opacity: 0.95; transition: none; }
#knob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: rgba(233,246,247,0.82); box-shadow: 0 2px 8px rgba(0,0,0,0.4); }
#volley {
  position: absolute; right: max(24px, env(safe-area-inset-right, 0px)); bottom: 52px;
  width: 96px; height: 96px; border-radius: 50%; border: 2px solid var(--brass); cursor: pointer;
  background: conic-gradient(rgba(4,26,36,0.88) var(--cd, 0deg), var(--brass) 0);
  color: var(--brass-dark); font-family: var(--display); font-weight: 900; font-size: 22px; letter-spacing: 0.08em;
  display: grid; place-items: center; touch-action: none; box-shadow: 0 4px 16px rgba(0,0,0,0.4);
}
#volley.cooling { color: rgba(233,246,247,0.7); }
#hint { position: absolute; left: 0; right: 0; bottom: 14px; text-align: center; font-size: 12px; letter-spacing: 0.08em; color: rgba(233,246,247,0.78); text-shadow: 0 1px 3px rgba(0,0,0,0.7); pointer-events: none; padding-inline: 150px; transition: opacity 0.6s; }
#hint.gone { opacity: 0; }
#toast { position: absolute; left: 50%; top: 24%; translate: -50% 0; padding: 8px 18px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); font-family: var(--display); font-weight: 900; font-size: 20px; letter-spacing: 0.1em; pointer-events: none; opacity: 0; transition: opacity 0.3s; white-space: nowrap; max-width: 90%; text-align: center; }
#toast.on { opacity: 1; }

/* overlay */
#overlay {
  position: absolute; inset: 0; display: grid; place-items: center;
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: radial-gradient(ellipse at center, rgba(3,18,26,0.35), rgba(3,18,26,0.82));
  backdrop-filter: blur(3px);
}
#overlay[hidden] { display: none; }
.card { width: 100%; max-width: 440px; max-height: 100%; overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 24px 22px; display: flex; flex-direction: column; gap: 14px; }
.card h1 { margin: 0; font-family: var(--display); font-weight: 900; font-size: 44px; line-height: 1.05; letter-spacing: 0.12em; text-wrap: balance; }
.card h1 span { color: var(--brass); }
.card p { margin: 0; color: rgba(233,246,247,0.82); line-height: 1.6; }
.card ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.card li { display: grid; grid-template-columns: 76px 1fr; gap: 10px; align-items: baseline; line-height: 1.5; }
.card li b { font-size: 12px; letter-spacing: 0.1em; color: var(--cyan); }
.res { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.res div { background: rgba(4,26,36,0.9); padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
.res small { font-size: 11px; letter-spacing: 0.1em; color: rgba(233,246,247,0.6); }
.res b { font-size: 24px; font-variant-numeric: tabular-nums; }
.btn { cursor: pointer; border: 0; border-radius: 8px; min-height: 52px; background: var(--brass); color: var(--brass-dark); font-family: var(--display); font-weight: 900; font-size: 22px; letter-spacing: 0.2em; }
.btn:active { filter: brightness(0.92); }
#nogl { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; line-height: 1.7; }
#mission { align-self: flex-start; width: min(300px, 100%); box-sizing: border-box; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; backdrop-filter: blur(6px); display: flex; flex-direction: column; gap: 6px; }
#mission[hidden] { display: none; }
.m-t { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-weight: 700; }
.m-t small { color: var(--brass); font-size: 11px; letter-spacing: 0.1em; white-space: nowrap; }
.m-bar { height: 6px; border-radius: 3px; background: rgba(0,0,0,0.5); overflow: hidden; border: 1px solid var(--line); }
.m-bar i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, var(--cyan), #8be9ff); transform-origin: left center; }
.m-sub { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: rgba(233,246,247,0.78); font-variant-numeric: tabular-nums; }
.m-sub.warn { color: #ff9a9a; }
#m-list { margin: 0; padding: 6px 0 0; list-style: none; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 3px; font-size: 12px; }
#m-list li { display: flex; gap: 6px; align-items: baseline; color: rgba(233,246,247,0.88); }
#m-list li::before { content: '\25CB'; color: rgba(233,246,247,0.5); }
#m-list li span { flex: 1; min-width: 0; }
#m-list li em { font-style: normal; color: var(--brass); font-variant-numeric: tabular-nums; white-space: nowrap; }
#m-list li.done { color: var(--ok); }
#m-list li.done::before { content: '\25CF'; color: var(--ok); }
#m-list li.fail { color: rgba(233,246,247,0.4); text-decoration: line-through; }
#m-list li.fail::before { content: '\2715'; color: var(--signal); }
.port-tag { position: absolute; left: 0; top: 0; will-change: transform; padding: 3px 10px; border-radius: 6px; background: var(--panel); border: 1px solid var(--brass); color: var(--brass); font-family: var(--display); font-weight: 900; font-size: 14px; letter-spacing: 0.12em; white-space: nowrap; pointer-events: none; }
.lab .nm { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; color: #ffd0d0; text-shadow: 0 1px 3px rgba(0,0,0,0.8); white-space: nowrap; }
.lab.merch .hex { background: var(--brass); }
.lab.merch .bar { width: 84px; }
.lab.merch .bar i { background: var(--brass); }
.lab.merch .nm { color: var(--brass); }
.lab.elite .bar { width: 96px; height: 10px; }
.arrow.merch { background: var(--brass); }
.legline { font-size: 12px; letter-spacing: 0.12em; color: var(--cyan); }
.card h1.sm { font-size: 32px; }
.shop { display: flex; flex-direction: column; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.shop-row { background: rgba(4,26,36,0.92); padding: 9px 12px; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; }
.shop-row b { font-weight: 700; }
.shop-row em { font-style: normal; color: var(--cyan); font-size: 12px; margin-left: 6px; font-variant-numeric: tabular-nums; }
.shop-row small { grid-column: 1; color: rgba(233,246,247,0.62); font-size: 12px; }
.shop-row button { grid-row: 1 / 3; grid-column: 2; min-height: 44px; min-width: 78px; border-radius: 6px; border: 1px solid var(--brass); background: transparent; color: var(--brass); cursor: pointer; font-weight: 700; font-variant-numeric: tabular-nums; }
.shop-row button:disabled { opacity: 0.4; cursor: default; border-color: var(--line); color: var(--foam); }
.goldline { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; font-size: 12px; letter-spacing: 0.12em; color: rgba(233,246,247,0.7); }
.goldline b { color: var(--brass); font-size: 20px; font-variant-numeric: tabular-nums; letter-spacing: 0; }
.sum { display: flex; flex-direction: column; gap: 5px; font-size: 13px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: rgba(4,26,36,0.6); }
.sum div { display: flex; justify-content: space-between; gap: 10px; }
.sum .ok b { color: var(--brass); }
.sum .miss { color: rgba(233,246,247,0.45); }
.btn.sec { background: transparent; border: 1px solid var(--line); color: var(--foam); font-size: 16px; letter-spacing: 0.12em; min-height: 46px; }
@media (max-width: 480px) {
  .card h1 { font-size: 38px; }
  #hint { padding-inline: 124px; }
  .stat { padding: 6px 9px; min-width: 44px; }
}
@media (max-height: 520px) {
  #stick { bottom: 16px; width: 104px; height: 104px; }
  #volley { bottom: 20px; width: 84px; height: 84px; }
  #hint { display: none; }
}
@media (prefers-reduced-motion: reduce) { .pop { animation-duration: 0.01s; } }
</style>

<div id="app">
  <div id="labels"></div>
  <div id="top">
    <div class="row1">
      <div class="stats">
        <div class="stat"><small>航段</small><b id="s-wave">1</b></div>
        <div class="stat gold"><small>經費</small><b id="s-gold">0</b></div>
        <div class="stat"><small>目標</small><b id="s-foe">0</b></div>
      </div>
      <div class="btns">
        <button class="btn-ghost" id="soundBtn" type="button">音效 開</button>
        <button class="btn-ghost" id="pauseBtn" type="button">暫停</button>
      </div>
    </div>
    <div class="hull">
      <div class="hexb" id="p-level">1</div>
      <div class="bars">
        <div class="bar-hp" id="hpbar"><i id="hpfill"></i></div>
        <div class="bar-xp"><i id="xpfill"></i></div>
      </div>
      <div id="hp-text">120</div>
    </div>
    <div id="mission" hidden></div>
  </div>
  <div class="port-tag" id="portTag" hidden></div>
  <div id="stick"><div id="knob"></div></div>
  <button id="volley" type="button" aria-label="水砲齊射">齊射</button>
  <div id="hint">拖曳畫面操舵 · 護送漁船返港 · 空白鍵水砲齊射</div>
  <div id="toast"></div>
  <div id="overlay">
    <div class="card" id="card"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const app = $('app'), labelsEl = $('labels');
  const TAU = Math.PI * 2;

  /* ---------- renderer ---------- */
  let renderer;
  try {
    if (typeof THREE === 'undefined') throw new Error('three');
    renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  } catch (e) {
    const d = document.createElement('div');
    d.id = 'nogl';
    d.textContent = '無法啟動 3D 繪圖(WebGL)。請換用支援 WebGL 的瀏覽器,或確認網路可載入 Three.js。';
    app.appendChild(d);
    $('overlay').hidden = true;
    return;
  }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  app.insertBefore(renderer.domElement, app.firstChild);

  const SKY = 0x0e5f78;
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(SKY);
  scene.fog = new THREE.Fog(SKY, 75, 175);
  const camera = new THREE.PerspectiveCamera(45, 1, 1, 320);
  scene.add(new THREE.HemisphereLight(0xdff4ff, 0x1a5a70, 0.95));
  const sun = new THREE.DirectionalLight(0xfff3d6, 0.9);
  sun.position.set(-30, 50, 20);
  scene.add(sun);

  let W = 1, H = 1, camH = 38;
  function resize() {
    W = app.clientWidth || 1; H = app.clientHeight || 1;
    renderer.setSize(W, H, false);
    camera.aspect = W / H;
    camH = W / H >= 1 ? 38 : 38 / Math.pow(W / H, 0.7);
    camera.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(app);
  resize();

  /* ---------- world constants ---------- */
  const ARENA = 96;
  const ISL = { x: -12, z: -80, r: 26 };
  const HARBOR = { x: -2, z: -46, r: 6.5 };

  /* ---------- ocean ---------- */
  const seaGeo = new THREE.PlaneGeometry(280, 280, 56, 56);
  seaGeo.rotateX(-Math.PI / 2);
  const seaMat = new THREE.MeshStandardMaterial({ color: 0x1d86a0, flatShading: true, roughness: 0.85, metalness: 0 });
  const sea = new THREE.Mesh(seaGeo, seaMat);
  scene.add(sea);
  const seaPos = seaGeo.attributes.position;
  const seaBaseX = new Float32Array(seaPos.count), seaBaseZ = new Float32Array(seaPos.count);
  for (let i = 0; i < seaPos.count; i++) { seaBaseX[i] = seaPos.getX(i); seaBaseZ[i] = seaPos.getZ(i); }

  const TILE = 40;
  function blotchTexture() {
    const c = document.createElement('canvas');
    c.width = c.height = 256;
    const g = c.getContext('2d');
    let seed = 7;
    const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
    for (let i = 0; i < 38; i++) {
      const x = rnd() * 256, y = rnd() * 256, rx = 10 + rnd() * 26, ry = 6 + rnd() * 16, rot = rnd() * Math.PI;
      g.fillStyle = i % 3 === 0 ? 'rgba(18,96,108,0.30)' : 'rgba(150,176,64,0.26)';
      for (let ox = -256; ox <= 256; ox += 256) for (let oy = -256; oy <= 256; oy += 256) {
        g.beginPath(); g.ellipse(x + ox, y + oy, rx, ry, rot, 0, TAU); g.fill();
      }
    }
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(280 / TILE, 280 / TILE);
    return t;
  }
  const blotchTex = blotchTexture();
  const blotchGeo = new THREE.PlaneGeometry(280, 280);
  blotchGeo.rotateX(-Math.PI / 2);
  const blotch = new THREE.Mesh(blotchGeo, new THREE.MeshBasicMaterial({ map: blotchTex, transparent: true, depthWrite: false, fog: true }));
  blotch.position.y = 0.34;
  scene.add(blotch);

  let seaAmp = 1;
  function updateSea(cx, cz, t) {
    const sx = Math.round(cx / 5) * 5, sz = Math.round(cz / 5) * 5;
    sea.position.set(sx, 0, sz);
    for (let i = 0; i < seaPos.count; i++) {
      const x = seaBaseX[i] + sx, z = seaBaseZ[i] + sz;
      seaPos.setY(i, (Math.sin(x * 0.16 + t * 0.8) * 0.1 + Math.sin(z * 0.13 - t * 0.6) * 0.09 + Math.sin((x + z) * 0.07 + t * 0.4) * 0.09) * seaAmp);
    }
    seaPos.needsUpdate = true;
    blotch.position.x = cx; blotch.position.z = cz;
    blotchTex.offset.set(cx / TILE + t * 0.004, -cz / TILE + t * 0.002);
  }

  /* ---------- island & harbor ---------- */
  const flat = (hex, extra) => new THREE.MeshStandardMaterial(Object.assign({ color: hex, flatShading: true, roughness: 0.9, metalness: 0 }, extra || {}));
  function buildIsland() {
    const g = new THREE.Group();
    g.position.set(ISL.x, 0, ISL.z);
    const shallow = new THREE.Mesh(new THREE.CylinderGeometry(40, 40, 0.1, 40), flat(0x55c8c6, { transparent: true, opacity: 0.55 }));
    shallow.position.y = 0.22; g.add(shallow);
    const sand = new THREE.Mesh(new THREE.CylinderGeometry(25, 27, 1.0, 22), flat(0xf0d9a0));
    sand.position.y = 0.25; g.add(sand);
    const grass = new THREE.Mesh(new THREE.CylinderGeometry(19, 22, 0.8, 18), flat(0x5cb23c));
    grass.position.y = 0.95; g.add(grass);
    const houseSpots = [[-9, 8], [-3, 11], [5, 10], [11, 5], [-12, 0], [10, -4], [-5, 2], [3, 3]];
    houseSpots.forEach(([x, z], i) => {

      if (d > ARENA - 14) { c.x *= (ARENA - 14) / d; c.z *= (ARENA - 14) / d; }
      pts.push(c);
    });
    pts.push({ x: HARBOR.x, z: HARBOR.z });
    route = pts; routeCum = [0];
    for (let i = 1; i < pts.length; i++) routeCum.push(routeCum[i - 1] + Math.hypot(pts[i].x - pts[i - 1].x, pts[i].z - pts[i - 1].z));
    routeLen = routeCum[routeCum.length - 1];
    if (routeLine) { scene.remove(routeLine); routeLine.geometry.dispose(); routeLine.material.dispose(); }
    const geo = new THREE.BufferGeometry().setFromPoints(pts.map((p) => new THREE.Vector3(p.x, 0.5, p.z)));
    routeLine = new THREE.Line(geo, new THREE.LineDashedMaterial({ color: 0xffffff, dashSize: 2.2, gapSize: 1.6, transparent: true, opacity: 0.55 }));
    routeLine.computeLineDistances();
    scene.add(routeLine);
  }

  function planLeg() {
    const n = legN, cnt = 2 + (n >= 4 ? 1 : 0) + (n >= 10 ? 1 : 0);
    ambushes = []; ambushIdx = 0;
    for (let k = 0; k < cnt; k++) {
      const size = clamp(2 + Math.floor(n / 2) + k, 2, 8), specs = [];
      for (let i = 0; i < size; i++) specs.push({ elite: false });
      ambushes.push({ frac: 0.2 + 0.65 * (k / (cnt - 1)), specs });
    }
    const last = ambushes[cnt - 1];
    if (legData.boss) { last.specs = last.specs.slice(0, Math.max(2, last.specs.length - 2)); last.specs.unshift({ elite: true, boss: true }); }
    else if (n % 3 === 2) { last.specs.pop(); last.specs.unshift({ elite: true }); }
  }

  function spawnCrates(n) {
    for (let i = 0; i < n; i++) {
      let x = 0, z = 0;
      for (let k = 0; k < 30; k++) {
        const a = Math.random() * TAU, r = 15 + Math.random() * 65;
        x = Math.sin(a) * r; z = Math.cos(a) * r;
        if (Math.hypot(x - ISL.x, z - ISL.z) > ISL.r + 8) break;
      }
      const g = new THREE.Group();
      g.add(new THREE.Mesh(crateBoxGeo, crateMat), new THREE.Mesh(crateBandGeo, bandMat));
      g.position.set(x, 0.45, z); scene.add(g);
      crates.push({ mesh: g, x, z });
    }
  }

  function makeObjectives() {
    const total = ambushes.reduce((a, b) => a + b.specs.length, 0);
    const pool = ['kills', 'hull', 'time', 'crates'];
    for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp; }
    const pick = pool.slice(0, 2);
    objectives = pick.map((k) => {
      const o = { k, state: 'pending', reward: 60 + legN * 10 };
      if (k === 'kills') { o.target = Math.max(2, Math.round(total * 0.7)); o.label = '攔截 ' + o.target + ' 艘可疑船'; }
      else if (k === 'crates') { o.target = 4; o.label = '回收 4 個漂流漁具箱'; }
      else if (k === 'hull') o.label = '漁船船體保持 60% 以上';
      else o.label = '限時 ' + timeLimit + ' 秒內抵達';
      return o;
    });
    spawnCrates(pick.indexOf('crates') >= 0 ? 6 : 3);
  }

  function updateObjectives() {
    for (const o of objectives) {
      if (o.state !== 'pending') continue;
      if (o.k === 'kills' && kills - legKills0 >= o.target) o.state = 'done';
      else if (o.k === 'crates' && crateGot >= o.target) o.state = 'done';
      else if (o.k === 'hull' && merchant && merchant.hp / merchant.maxHp < 0.6) o.state = 'fail';
      else if (o.k === 'time' && legT > timeLimit) o.state = 'fail';
      if (o.state === 'done') { toast('任務完成:' + o.label, 1800); blip(560, 0.2, 0.1); }
      else if (o.state === 'fail') toast('任務失敗:' + o.label, 1800);
    }
  }
  function objProg(o) {
    if (o.k === 'kills') return Math.min(o.target, kills - legKills0) + '/' + o.target;
    if (o.k === 'crates') return Math.min(o.target, crateGot) + '/' + o.target;
    if (o.k === 'hull') return merchant ? Math.round(Math.max(0, merchant.hp) / merchant.maxHp * 100) + '%' : '';
    return Math.max(0, Math.ceil(timeLimit - legT)) + ' 秒';
  }
  function updateMission() {
    const box = $('mission');
    if (!merchant || !legData || state === 'menu') { box.hidden = true; return; }
    box.hidden = false;
    const pct = Math.round(progress * 100), hp = Math.max(0, Math.round(merchant.hp / merchant.maxHp * 100));
    const sub = merchant.arrived ? (foes().length ? '已返港 · 攔截殘餘' : '已返港') : merchant.waiting ? '漁船等待護航' : '航程 ' + pct + '%';
    let list = '';
    objectives.forEach((o) => {
      list += '<li class="' + (o.state === 'pending' ? '' : o.state) + '"><span>' + o.label + '</span><em>' + (o.state === 'done' ? '+' + o.reward : o.state === 'fail' ? '' : objProg(o)) + '</em></li>';
    });
    const html = '<div class="m-t"><span>護送漁船「海安號」</span><small>' + legData.title + '</small></div>' +
      '<div class="m-bar"><i style="transform:scaleX(' + progress.toFixed(3) + ')"></i></div>' +
      '<div class="m-sub' + (hp < 40 ? ' warn' : '') + '"><span>' + sub + '</span><span>漁船 ' + hp + '%</span></div><ul id="m-list">' + list + '</ul>';
    if (html !== mSig) { mSig = html; box.innerHTML = html; }
  }

  function calcProgress() {
    if (!merchant) return 0;
    if (merchant.arrived) return 1;
    const a = route[Math.max(0, merchant.wp - 1)], tg = route[merchant.wp];
    const seg = Math.hypot(tg.x - a.x, tg.z - a.z) || 1;
    const done = clamp(1 - Math.hypot(tg.x - merchant.x, tg.z - merchant.z) / seg, 0, 1);
    return clamp((routeCum[merchant.wp - 1] + done * seg) / routeLen, 0, 1);
  }
  function merchantAI(m, dt) {
    if (m.arrived) { updateShip(m, dt, null, 0, 0, 1); return; }
    const tg = route[m.wp], dx = tg.x - m.x, dz = tg.z - m.z, d = Math.hypot(dx, dz);
    const last = m.wp === route.length - 1;
    if (d < (last ? 6 : 8)) { if (last) m.arrived = true; else m.wp++; }
    m.waiting = !player.dead && Math.hypot(player.x - m.x, player.z - m.z) > 55;
    updateShip(m, dt, m.arrived ? null : Math.atan2(dx, dz), m.waiting ? 0.15 : 1, m.maxSpeed, 0.8);
  }

  function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify({ n: legN, gold, kills, up })); } catch (e) { /* ignore */ } }
  function load() {
    try { const v = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); return v && typeof v.n === 'number' ? v : null; } catch (e) { return null; }
  }

  function startLeg() {
    clearEntities();
    legData = legInfo(legN); wave = 1 + legN * 0.85;
    applyTheme(legData.theme); applyUpgrades();
    failReason = ''; completed = false; clearedWarn = false; progress = 0; legT = 0; crateGot = 0; spawnQueue = []; queueT = 0;
    volleyCd = 0; overT = 0; shake = 0; level = 1; xp = 0; nextXp = 40; legGold0 = gold; legKills0 = kills; mSig = '';
    buildRoute(); planLeg();
    timeLimit = Math.round(routeLen / 4.6 * 1.35 + ambushes.length * 12);
    makeObjectives();
    const h0 = Math.atan2(route[1].x - route[0].x, route[1].z - route[0].z);
    merchant = createShip('p', route[0].x, route[0].z, h0, false, 'merchant');
    player = createShip('p', route[0].x + 6, route[0].z + 8, h0);
    for (let i = 0; i < 1 + up.fleet; i++) spawnAlly();
    $('portTag').textContent = legData.to + '港';
    camera.userData.init = false;
    state = 'play'; overlay.hidden = true; $('pauseBtn').textContent = '暫停';
    hud(); toast(legData.title, 2200);
  }

  function completeLeg() {
    completed = true;
    objectives.forEach((o) => { if (o.state === 'pending' && (o.k === 'hull' || o.k === 'time')) o.state = 'done'; });
    const main = 100 + legN * 30;
    let bonus = 0;
    objectives.forEach((o) => { if (o.state === 'done') bonus += o.reward; });
    gold += main + bonus;
    const sum = {
      n: legN, v: legData.v, i: legData.i, from: legData.from, to: legData.to, outro: legData.outro, main,
      items: objectives.map((o) => ({ label: o.label, done: o.state === 'done', reward: o.reward }))
    };
    legN++; state = 'port'; releaseStick(); targetRing.visible = false;
    ships.forEach((s) => { s.speed = 0; });
    save(); blip(660, 0.3, 0.12);
    toast('抵達' + sum.to + '港', 2200);
    setTimeout(() => { if (state === 'port') showOverlay('port', sum); }, 1600);
  }

  function makeLabel(s) {
    const el = document.createElement('div');
    el.className = 'lab ' + (s.merchant ? 'merch' : s.team === 'p' ? 'me' : 'foe');
    el.innerHTML = '<div class="r"><span class="hex"></span><span class="bar"><i></i></span></div>' + (s.team === 'p' ? '' : '<div class="rw"><span class="coin"></span><b></b></div>');
    labelsEl.appendChild(el);
    s.lab = { el, hex: el.querySelector('.hex'), fill: el.querySelector('.bar i'), rw: el.querySelector('.rw b') };
    s.lab.hex.textContent = s.merchant ? '漁' : s.level;
    if (s.lab.rw) s.lab.rw.textContent = s.reward;
    if (s.team !== 'p' || s.merchant) {
      const a = document.createElement('div'); a.className = 'arrow' + (s.merchant ? ' merch' : ''); a.style.display = 'none';
      labelsEl.appendChild(a); s.arrow = a;
    }
  }

  function createShip(team, x, z, h, ally, kind) {
    const mesh = makeShipMesh(kind === 'merchant' ? 'merchant' : team === 'e' ? 'enemy' : 'player');
    const s = {
      team, ally: !!ally, x, z, h, speed: 0, dead: false, sink: 0, flash: 0, bank: 0, wakeT: 0, cd: 1 + Math.random(),
      phase: Math.random() * 6, radius: 1.8, group: mesh.group, hullMat: mesh.hullMat, orbit: Math.random() < 0.5 ? 1 : -1,
      pref: 13 + Math.random() * 4, lab: null, arrow: null
    };
    if (kind === 'merchant') {
      s.merchant = true; s.maxHp = Math.round((220 + legN * 20) * (1 + up.armor * 0.15)); s.hp = s.maxHp; s.level = 0; s.reward = 0;
      s.maxSpeed = 4.6; s.radius = 1.9; s.wp = 1; s.arrived = false; s.waiting = false;
      s.group.scale.setScalar(0.95);
    } else if (team === 'p' && !ally) {
      s.maxHp = 140 + up.hull * 20; s.hp = s.maxHp; s.level = 1; s.reward = 0; s.group.scale.setScalar(1.7); s.radius = 2.8;
    } else if (ally) {
      s.maxHp = Math.round(80 + wave * 8); s.hp = s.maxHp; s.level = Math.max(1, Math.floor(wave * 2)); s.reward = 0;
      s.group.scale.setScalar(0.85); s.dmg = 8 + wave; s.interval = 1.1; s.maxSpeed = 8.5; s.pref = 11 + Math.random() * 4;
    } else {
      s.maxHp = Math.round(30 + wave * 7); s.hp = s.maxHp; s.level = Math.floor(wave * 3) + Math.floor(Math.random() * 3) + 1;
      s.dmg = 5 + wave * 0.5; s.interval = Math.max(1.5, 2.6 - wave * 0.06);
      s.spread = Math.max(0.13, 0.26 - wave * 0.014); s.maxSpeed = 6 + Math.min(2.6, wave * 0.25);
      s.reward = Math.round(10 + wave * 3);
    }
    makeLabel(s);
    if (s.merchant) addName(s, '海安號');
    ships.push(s);
    return s;
  }

  function clearEntities() {
    ships.forEach((s) => { scene.remove(s.group); s.hullMat.dispose(); });
    ships.length = 0;
    labelsEl.innerHTML = '';
    while (fx.length) removeFx(0);
    balls.forEach((b) => scene.remove(b.mesh)); balls.length = 0;
    coins.forEach((c) => scene.remove(c.mesh)); coins.length = 0;
    crates.forEach((c) => scene.remove(c.mesh)); crates.length = 0;
    merchant = null;
  }

  function foes() { return ships.filter((s) => s.team === 'e' && !s.dead); }
  function nearestFoe(range) {
    let best = null, bd = range;
    for (const s of ships) {
      if (s.team !== 'e' || s.dead) continue;
      const d = Math.hypot(s.x - player.x, s.z - player.z);
      if (d < bd) { bd = d; best = s; }
    }
    return best;
  }

  /* ---------- combat ---------- */
  function shootBall(x, z, ang, speed, dmg, team, range) {
    const g = new THREE.Group();
    g.add(new THREE.Mesh(ballGeo, team === 'p' ? waterMat : ballMat));
    const tr = new THREE.Mesh(trailGeo, trailMat); tr.position.z = -1.1;
    g.add(tr);
    g.position.set(x, 0.95, z); g.rotation.y = ang;
    scene.add(g);
    balls.push({ mesh: g, x, z, vx: Math.sin(ang) * speed, vz: Math.cos(ang) * speed, ttl: range / speed, dmg, team });
    puff(x, 1.0, z, 0.8, 0.8, 0xf1f1ee, 0.5, Math.sin(ang) * 1.2, Math.cos(ang) * 1.2);
    puff(x, 1.0, z, 0.55, 0.6, 0xbcc6c8, 0.9, Math.sin(ang) * 2.2, Math.cos(ang) * 2.2);
  }
  function aimAt(s, tgt, speed, spread) {
    const d = Math.hypot(tgt.x - s.x, tgt.z - s.z), tt = d / speed;
    const px = tgt.x + Math.sin(tgt.h) * tgt.speed * tt * 0.9;
    const pz = tgt.z + Math.cos(tgt.h) * tgt.speed * tt * 0.9;
    return Math.atan2(px - s.x, pz - s.z) + (Math.random() - 0.5) * spread;
  }
  function popText(x, z, text, hurt) {
    const v = new THREE.Vector3(x, 2.4, z).project(camera);
    const el = document.createElement('div');
    el.className = 'pop' + (hurt ? ' hurt' : '');
    el.textContent = text;
    el.style.setProperty('--x', ((v.x * 0.5 + 0.5) * W) + 'px');
    el.style.setProperty('--y', ((-v.y * 0.5 + 0.5) * H) + 'px');
    labelsEl.appendChild(el);
    setTimeout(() => el.remove(), 900);
  }

  function hurtShip(s, dmg, x, z) {
    if (s.dead) return;
    s.hp -= dmg; s.flash = 1;
    popText(x, z, '-' + Math.round(dmg), s.team === 'p');
    puff(x, 1.2, z, 0.9, 0.7, 0x3a3a3a, 1.0);
    puff(x, 1.2, z, 0.6, 0.45, 0xffb347, 0.8);
    if (s === player) { shake = Math.min(0.6, shake + 0.25); boom(0.28, 140, 0.3); } else boom(0.2, 220, 0.2);
    if (s.hp <= 0) killShip(s);
  }

  function killShip(s) {
    s.hp = 0; s.dead = true;
    if (s.lab) { s.lab.el.style.display = 'none'; }
    if (s.arrow) s.arrow.style.display = 'none';
    for (let i = 0; i < 7; i++) puff(s.x + (Math.random() - 0.5) * 3, 1.4, s.z + (Math.random() - 0.5) * 4, 1.4 + Math.random(), 1.1, s.team === 'e' ? (i % 2 ? 0xffffff : 0xbfefff) : (i % 2 ? 0x2b2b2b : 0xff9a3c), 1.2, (Math.random() - 0.5) * 2, (Math.random() - 0.5) * 2);
    boom(0.45, 90, 0.55);
    shake = Math.min(0.8, shake + 0.4);
    if (s.team === 'e') {
      kills++;
      const n = 4 + Math.floor(Math.random() * 2), each = Math.max(1, Math.round(s.reward / n));
      for (let i = 0; i < n; i++) {
        const m = new THREE.Mesh(coinGeo, coinMat);
        const a = Math.random() * TAU, sp = 3 + Math.random() * 4;
        m.position.set(s.x, 0.6, s.z); scene.add(m);
        coins.push({ mesh: m, x: s.x, z: s.z, vx: Math.sin(a) * sp, vz: Math.cos(a) * sp, t: 0, value: each });
      }
    } else if (s === player) {
      failReason = '福星艦失能'; overT = 1.8;
    } else if (s.merchant) {
      failReason = '漁船沉沒'; overT = 1.8;
    } else {
      toast('一艘巡防艇失去動力', 1400);
    }
  }

  function volley() {
    if (state !== 'play' || player.dead || volleyCd > 0) return;
    volleyCd = VOLLEY_CD;
    const tgt = nearestFoe(32);
    const base = tgt ? aimAt(player, tgt, 30, 0) : player.h;
    for (let i = -2; i <= 2; i++) {
      const a = base + i * 0.11;
      shootBall(player.x + Math.sin(a) * 1.6, player.z + Math.cos(a) * 1.6, a, 30, stats.dmg * 1.3, 'p', 28);
    }
    shake = Math.min(0.6, shake + 0.2);
    boom(0.5, 130, 0.5);
  }

  /* ---------- HUD ---------- */
  const el = {
    wave: $('s-wave'), gold: $('s-gold'), foe: $('s-foe'), lvl: $('p-level'), hp: $('hpfill'), hpbar: $('hpbar'),
    hpt: $('hp-text'), xp: $('xpfill'), vol: $('volley'), toast: $('toast'), hint: $('hint')
  };
  let toastTimer = 0;
  function toast(msg, ms) {
    el.toast.textContent = msg; el.toast.classList.add('on');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => el.toast.classList.remove('on'), ms || 1800);
  }
  function hud() {
    el.wave.textContent = legN + 1; el.gold.textContent = gold; el.foe.textContent = foes().length + spawnQueue.length;
    el.lvl.textContent = level;
    const hp = player ? Math.max(0, player.hp) : 0, mx = player ? player.maxHp : 1;

  function gainGold(v) {
    gold += v; xp += v;
    while (xp >= nextXp) {
      xp -= nextXp; level++; nextXp = 40 + (level - 1) * 35;
      stats.dmg += 1.5; stats.interval = Math.max(0.35, stats.interval * 0.94);
      player.maxHp += 12; player.hp = Math.min(player.maxHp, player.hp + player.maxHp * 0.4);
      player.level = level; if (player.lab) player.lab.hex.textContent = level;
      toast('升級!等級 ' + level, 1600);
      blip(520, 0.25, 0.12);
    }
  }

  /* ---------- input ---------- */
  const keys = { l: false, r: false, u: false, d: false };
  const stick = { id: null, x: 0, y: 0, bx: 0, by: 0 };
  const stickEl = $('stick'), knob = $('knob');
  const R = 58;
  function gone() { if (!hintGone) { hintGone = true; el.hint.classList.add('gone'); } }

  app.addEventListener('pointerdown', (e) => {
    if (e.target.closest('button') || e.target.closest('#overlay')) return;
    if (state !== 'play' || stick.id !== null) return;
    ensureAudio(); gone();
    const r = app.getBoundingClientRect();
    stick.id = e.pointerId; stick.bx = e.clientX - r.left; stick.by = e.clientY - r.top; stick.x = stick.y = 0;
    stickEl.style.left = (stick.bx - 62) + 'px'; stickEl.style.top = (stick.by - 62) + 'px'; stickEl.style.bottom = 'auto';
    stickEl.classList.add('on'); knob.style.transform = 'translate(0,0)';
    try { app.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  });
  app.addEventListener('pointermove', (e) => {
    if (e.pointerId !== stick.id) return;
    const r = app.getBoundingClientRect();
    const dx = e.clientX - r.left - stick.bx, dy = e.clientY - r.top - stick.by, len = Math.hypot(dx, dy);
    if (len < 1) { stick.x = stick.y = 0; knob.style.transform = 'translate(0,0)'; return; }
    const k = Math.min(1, len / R);
    stick.x = dx / len * k; stick.y = dy / len * k;
    knob.style.transform = 'translate(' + (stick.x * R) + 'px,' + (stick.y * R) + 'px)';
  });
  function endStick(e) {
    if (e.pointerId !== stick.id) return;
    releaseStick();
  }
  function releaseStick() {
    stick.id = null; stick.x = stick.y = 0;
    stickEl.classList.remove('on'); stickEl.style.left = stickEl.style.top = stickEl.style.bottom = '';
    knob.style.transform = 'translate(0,0)';
  }
  app.addEventListener('pointerup', endStick);
  app.addEventListener('pointercancel', endStick);
  $('volley').addEventListener('pointerdown', (e) => { e.preventDefault(); e.stopPropagation(); ensureAudio(); gone(); volley(); });

  addEventListener('keydown', (e) => {
    const k = e.key;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.l = true;
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.r = true;
    else if (k === 'ArrowUp' || k === 'w' || k === 'W') keys.u = true;
    else if (k === 'ArrowDown' || k === 's' || k === 'S') keys.d = true;
    else if (k === ' ') { e.preventDefault(); ensureAudio(); volley(); }
    else if (k === 'p' || k === 'P' || k === 'Escape') { togglePause(); return; }
    else return;
    gone();
    if (k.startsWith('Arrow')) e.preventDefault();
  });
  addEventListener('keyup', (e) => {
    const k = e.key;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.l = false;
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.r = false;
    else if (k === 'ArrowUp' || k === 'w' || k === 'W') keys.u = false;
    else if (k === 'ArrowDown' || k === 's' || k === 'S') keys.d = false;
  });
  addEventListener('blur', () => { keys.l = keys.r = keys.u = keys.d = false; });

  /* ---------- overlay & flow ---------- */
  const overlay = $('overlay'), card = $('card');
  function renderShop() {
    const box = $('shop');

  function newGame() {
    legN = 0; gold = 80; kills = 0;
    Object.keys(up).forEach((k) => { up[k] = 0; });
    save(); showOverlay('port', null);
  }
  function continueGame() {

  function retryLeg() { gold = legGold0; kills = legKills0; startLeg(); }
  function backToPort() { gold = legGold0; kills = legKills0; showOverlay('port', null); }

  function togglePause() {
    if (state === 'play') { state = 'paused'; releaseStick(); showOverlay('paused'); $('pauseBtn').textContent = '繼續'; }
    else if (state === 'paused') resume();

  function resume() { state = 'play'; overlay.hidden = true; $('pauseBtn').textContent = '暫停'; last = performance.now(); }
  $('pauseBtn').addEventListener('click', togglePause);
  $('soundBtn').addEventListener('click', () => { ensureAudio(); soundOn = !soundOn; $('soundBtn').textContent = '音效 ' + (soundOn ? '開' : '關'); });
  document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') togglePause(); });

  /* ---------- update ---------- */
  function updateShip(s, dt, desired, throttle, maxSpeed, turn) {
    let dh = 0;
    if (desired !== null) {
      dh = wrap(desired - s.h);
      s.h += clamp(dh, -turn * dt, turn * dt);
    }
    const target = desired === null ? 0 : maxSpeed * throttle;
    s.speed += (target - s.speed) * Math.min(1, dt * (target > s.speed ? 1.2 : 1.8));
    s.x += Math.sin(s.h) * s.speed * dt; s.z += Math.cos(s.h) * s.speed * dt;
    const tb = clamp(-dh * 0.22, -0.22, 0.22);
    s.bank += (tb - s.bank) * Math.min(1, dt * 3);
    // island
    let dx = s.x - ISL.x, dz = s.z - ISL.z, d = Math.hypot(dx, dz);
    if (d < ISL.r + 1.5) { s.x = ISL.x + dx / d * (ISL.r + 1.5); s.z = ISL.z + dz / d * (ISL.r + 1.5); s.speed *= 0.9; }
    d = Math.hypot(s.x, s.z);
    if (d > ARENA - 3) { s.x *= (ARENA - 3) / d; s.z *= (ARENA - 3) / d; s.speed *= 0.95; }
  }
  function syncShip(s, dt) {
    const bob = Math.sin(t * 2 + s.phase) * 0.07, sk = s.team === 'e' ? 0 : s.sink;
    s.group.position.set(s.x, bob - sk * 0.9, s.z);
    s.group.rotation.y = s.h;
    s.group.rotation.x = Math.sin(t * 1.6 + s.phase) * 0.025 + sk * 0.1;
    s.group.rotation.z = Math.sin(t * 1.3 + s.phase) * 0.04 + s.bank + sk * 0.25;
    const lt = s.group.userData.lights; if (lt && !s.dead) { const ph = Math.floor(t * 5) % 2; lt[0].visible = ph === 0; lt[1].visible = ph === 1; }
    if (s.flash > 0) { s.flash = Math.max(0, s.flash - dt * 5); }
    s.hullMat.emissive.setRGB(s.flash * 0.8, s.flash * 0.12, s.flash * 0.08);
    if (!s.dead && s.speed > 1.5) {
      s.wakeT -= dt;
      if (s.wakeT <= 0) {
        s.wakeT = 0.08;
        const sh = Math.sin(s.h), ch = Math.cos(s.h);
        wake(s.x - sh * 2.5 + ch * 0.8, s.z - ch * 2.5 - sh * 0.8, s.h);
        wake(s.x - sh * 2.5 - ch * 0.8, s.z - ch * 2.5 + sh * 0.8, s.h);
      }
    }
  }

  function nearestFriend(e) {
    let best = null, bd = 1e9;
    for (const s of ships) {
      if (s.team !== 'p' || s.dead) continue;
      const d = Math.hypot(s.x - e.x, s.z - e.z) * (s.merchant ? 0.7 : 1);
      if (d < bd) { bd = d; best = s; }
    }
    return best;
  }
  function allyAI(a, dt) {
    let tgt = null, bd = 30;
    for (const s of ships) {
      if (s.team !== 'e' || s.dead) continue;
      const d = Math.hypot(s.x - a.x, s.z - a.z);
      if (d < bd) { bd = d; tgt = s; }
    }
    let desired = null, thr = 1;
    if (tgt) {
      const toT = Math.atan2(tgt.x - a.x, tgt.z - a.z);
      if (bd > a.pref + 4) desired = toT;
      else if (bd < a.pref - 4) { desired = toT + a.orbit * 2.3; thr = 0.8; }
      else { desired = toT + a.orbit * 1.45; thr = 0.7; }
    } else {
      const home = merchant && !merchant.dead ? merchant : (player.dead ? null : player);
      if (home) {
        const pd = Math.hypot(home.x - a.x, home.z - a.z);
        if (pd > 12) { desired = Math.atan2(home.x - a.x, home.z - a.z); thr = Math.min(1, pd / 25); }
      }
    }
    let vx = desired === null ? 0 : Math.sin(desired), vz = desired === null ? 0 : Math.cos(desired);
    for (const o of ships) {
      if (o === a || o.team !== 'p' || o.dead) continue;
      const ox = a.x - o.x, oz = a.z - o.z, od = Math.hypot(ox, oz);
      if (od < 7 && od > 0.01) { vx += ox / od * (7 - od) * 0.25; vz += oz / od * (7 - od) * 0.25; desired = Math.atan2(vx, vz); }
    }
    updateShip(a, dt, desired, thr, a.maxSpeed, 1.8);
    a.cd -= dt;
    if (tgt && a.cd <= 0 && bd < 26) {
      a.cd = a.interval * (0.9 + Math.random() * 0.2);
      const ang = aimAt(a, tgt, 28, 0.1);
      shootBall(a.x + Math.sin(ang) * 1.5, a.z + Math.cos(ang) * 1.5, ang, 28, a.dmg, 'p', 28);
    }
  }
  function spawnAlly() {
    const p = player;
    const back = p.h + Math.PI + (Math.random() - 0.5) * 1.4, r = 9 + Math.random() * 5;
    let x = p.x + Math.sin(back) * r, z = p.z + Math.cos(back) * r;
    const d = Math.hypot(x, z);
    if (d > ARENA - 6) { x *= (ARENA - 6) / d; z *= (ARENA - 6) / d; }
    const a = createShip('p', x, z, p.h, true);
    for (let i = 0; i < 5; i++) puff(x + (Math.random() - 0.5) * 3, 0.8, z + (Math.random() - 0.5) * 4, 1.2, 0.9, 0xdff7ff, 1.0);
    return a;
  }

  function enemyAI(e, dt) {
    const player = nearestFriend(e);
    if (!player) { updateShip(e, dt, null, 0, 0, 1); return; }
    const dx = player.x - e.x, dz = player.z - e.z, d = Math.hypot(dx, dz) || 1;
    const toP = Math.atan2(dx, dz);
    let desired, thr = 1;
    if (d > e.pref + 4) desired = toP;
    else if (d < e.pref - 4) { desired = toP + e.orbit * 2.3; thr = 0.8; }
    else { desired = toP + e.orbit * 1.45; thr = 0.7; }
    let vx = Math.sin(desired), vz = Math.cos(desired);
    for (const o of ships) {
      if (o === e || o.team !== 'e' || o.dead) continue;
      const ox = e.x - o.x, oz = e.z - o.z, od = Math.hypot(ox, oz);
      if (od < 7 && od > 0.01) { vx += ox / od * (7 - od) * 0.25; vz += oz / od * (7 - od) * 0.25; }
    }
    const ix = e.x - ISL.x, iz = e.z - ISL.z, id = Math.hypot(ix, iz);
    if (id < ISL.r + 9) { vx += ix / id * 1.5; vz += iz / id * 1.5; }
    desired = Math.atan2(vx, vz);
    updateShip(e, dt, desired, thr, e.maxSpeed, 1.5);
    e.cd -= dt;
    if (!player.dead && e.cd <= 0 && d < 25) {
      e.cd = e.interval * (0.85 + Math.random() * 0.3);
      shootBall(e.x, e.z, aimAt(e, player, 24, e.spread), 24, e.dmg, 'e', 28);
      shootBall(e.x, e.z, aimAt(e, player, 24, e.spread + 0.05), 24, e.dmg, 'e', 28);
    }
  }

  function update(dt) {
    t += dt;
    const p = player;
    // player control
    if (!p.dead) {
      let sx = stick.x, sy = stick.y;
      if (state === 'play') {
        if (keys.l) sx -= 1; if (keys.r) sx += 1; if (keys.u) sy -= 1; if (keys.d) sy += 1;
      }
      let mag = Math.hypot(sx, sy);
      if (state === 'menu') { sx = Math.sin(t * 0.25); sy = Math.cos(t * 0.25) * 0.8 - 0.1; mag = 0.55; }
      if (mag > 0.1) updateShip(p, dt, Math.atan2(sx, sy), Math.min(1, mag * 1.2), stats.maxSpeed, 2.2);
      else updateShip(p, dt, null, 0, stats.maxSpeed, 2.2);
    } else {
      updateShip(p, dt, null, 0, 0, 1);
    }

    if (state === 'play' || state === 'over') {
      // leg flow
      if (state === 'play' && merchant) {
        legT += dt;
        progress = Math.max(progress, calcProgress());
        while (ambushIdx < ambushes.length && progress >= ambushes[ambushIdx].frac) {
          const am = ambushes[ambushIdx++];
          spawnQueue.push(...am.specs); queueT = 0.4;
          toast(am.specs.some((q) => q.boss) ? '「蛇王號」現身!' : '雷達發現可疑船隻!', 2000);
          if (ships.filter((q) => q.ally && !q.dead).length < 2 + up.fleet) { spawnAlly(); blip(660, 0.25, 0.1); }
        }
        if (spawnQueue.length) {
          queueT -= dt;
          if (queueT <= 0) { spawnEnemy(spawnQueue.shift()); queueT = 0.7; }
        }
        updateObjectives();
        if (merchant.arrived && !completed && !spawnQueue.length && ambushIdx >= ambushes.length) {
          if (foes().length === 0) completeLeg();
          else if (!clearedWarn) { clearedWarn = true; toast('攔截港口周邊的可疑船隻', 2000); }
        }
      }
      // player auto fire
      if (!p.dead && state === 'play') {
        p.cd -= dt;
        const tgt = nearestFoe(26);
        targetRing.visible = !!tgt;
        if (tgt) {
          targetRing.position.x = tgt.x; targetRing.position.z = tgt.z; targetRing.rotation.y = t * 1.5;
          if (p.cd <= 0) {
            p.cd = stats.interval;
            const a = aimAt(p, tgt, 30, 0.06);
            shootBall(p.x + Math.sin(a) * 1.5, p.z + Math.cos(a) * 1.5, a, 30, stats.dmg, 'p', 28);
          }
        }
        volleyCd = Math.max(0, volleyCd - dt);
        // harbor repair
        const hd = Math.hypot(p.x - HARBOR.x, p.z - HARBOR.z);
        if (hd < HARBOR.r && p.speed < 5 && p.hp < p.maxHp) {
          p.hp = Math.min(p.maxHp, p.hp + 9 * dt);
          if (Math.random() < dt * 4) puff(p.x + (Math.random() - 0.5) * 2, 1.5, p.z + (Math.random() - 0.5) * 3, 0.4, 0.8, 0x9ff3ff, 1.2);
        }
      } else targetRing.visible = false;
      // enemies
      for (const s of ships) {
        if (s.dead) continue;
        if (s.merchant) merchantAI(s, dt); else if (s.team === 'e') enemyAI(s, dt); else if (s.ally) allyAI(s, dt);
      }
      if (failReason && state === 'play') {
        overT -= dt;
        if (overT <= 0) { state = 'over'; releaseStick(); showOverlay('over'); }
      }
    } else {
      targetRing.visible = false;
    }

    // sinking & visuals
    for (let i = ships.length - 1; i >= 0; i--) {
      const s = ships[i];
      if (s.dead) {
        s.sink += dt; s.speed *= 0.97;
        if (s.sink > 2.4 && s !== player) { scene.remove(s.group); s.hullMat.dispose(); if (s.lab) s.lab.el.remove(); if (s.arrow) s.arrow.remove(); ships.splice(i, 1); continue; }
        if (s === player && s.sink > 2.4) s.group.visible = false;
      }
      syncShip(s, dt);
    }

    // cannonballs
    for (let i = balls.length - 1; i >= 0; i--) {
      const b = balls[i];
      b.x += b.vx * dt; b.z += b.vz * dt; b.ttl -= dt;
      b.mesh.position.x = b.x; b.mesh.position.z = b.z;
      let hit = false;
      for (const s of ships) {
        if (s.dead || s.team === b.team) continue;
        if (Math.hypot(s.x - b.x, s.z - b.z) < s.radius) { hurtShip(s, b.dmg, b.x, b.z); hit = true; break; }
      }
      if (!hit && Math.hypot(b.x - ISL.x, b.z - ISL.z) < ISL.r - 3) { puff(b.x, 1, b.z, 0.8, 0.6, 0xd9c48a, 0.8); hit = true; }
      if (hit) { scene.remove(b.mesh); balls.splice(i, 1); continue; }
      if (b.ttl <= 0) { splash(b.x, b.z, b.dmg > 10); scene.remove(b.mesh); balls.splice(i, 1); }
    }

    // coins
    for (let i = coins.length - 1; i >= 0; i--) {
      const c = coins[i];
      c.t += dt;
      c.vx *= Math.pow(0.04, dt); c.vz *= Math.pow(0.04, dt);
      let taken = false;
      if (!p.dead && state === 'play') {
        const dx = p.x - c.x, dz = p.z - c.z, d = Math.hypot(dx, dz);
        if (d < 2.6) { gainGold(c.value); blip(880, 0.08, 0.07); taken = true; }
        else if (d < 10 && c.t > 0.5) { c.vx += dx / d * 40 * dt; c.vz += dz / d * 40 * dt; }
      }
      c.x += c.vx * dt; c.z += c.vz * dt;
      c.mesh.position.set(c.x, 0.6 + Math.sin(t * 3 + i) * 0.08, c.z);
      c.mesh.rotation.y = t * 4 + i;
      c.mesh.visible = c.t < 22 || Math.floor(c.t * 6) % 2 === 0;
      if (taken || c.t > 26) { scene.remove(c.mesh); coins.splice(i, 1); }
    }

    // floating crates
    for (let i = crates.length - 1; i >= 0; i--) {
      const c = crates[i];
      c.mesh.position.y = 0.45 + Math.sin(t * 1.8 + i) * 0.12; c.mesh.rotation.y = t * 0.5 + i;
      if (state === 'play' && !p.dead && Math.hypot(p.x - c.x, p.z - c.z) < 3.4) {
        crateGot++; gainGold(25); popText(c.x, c.z, '+25', false); blip(740, 0.1, 0.08);
        scene.remove(c.mesh); crates.splice(i, 1);
      }
    }

    // fx
    for (let i = fx.length - 1; i >= 0; i--) {
      const o = fx[i];
      o.t += dt;
      const k = o.t / o.life;
      if (k >= 1) { removeFx(i); continue; }
      if (o.kind === 'puff') {
        o.mesh.position.y += o.vy * dt; o.mesh.position.x += o.vx * dt; o.mesh.position.z += o.vz * dt;
        o.mesh.scale.setScalar(o.size * (1 + k * 1.6)); o.mesh.material.opacity = o.op * (1 - k);
      } else if (o.kind === 'ring') {
        o.mesh.scale.setScalar(o.size * (1 + k * 3)); o.mesh.material.opacity = o.op * (1 - k);
      } else {
        o.mesh.scale.setScalar(1 + k * 1.4); o.mesh.material.opacity = o.op * (1 - k);
      }
    }

    // harbor pulse
    const pulse = 1 + Math.sin(t * 2.2) * 0.03;
    harbor.ring.scale.set(pulse, 1, pulse);

    // camera
    const lookX = p.x + Math.sin(p.h) * p.speed * 0.5, lookZ = p.z + Math.cos(p.h) * p.speed * 0.5;
    if (!camera.userData.init) { camera.userData.cx = lookX; camera.userData.cz = lookZ; camera.userData.init = true; }
    const f = 1 - Math.exp(-dt * 4);
    camera.userData.cx += (lookX - camera.userData.cx) * f;
    camera.userData.cz += (lookZ - camera.userData.cz) * f;
    shake = Math.max(0, shake - dt * 1.6);
    const sxo = (Math.random() - 0.5) * shake, szo = (Math.random() - 0.5) * shake;
    const cx = camera.userData.cx, cz = camera.userData.cz;
    camera.position.set(cx + sxo, camH, cz + camH * 0.34 + szo);
    camera.lookAt(cx, 0, cz - 1);
    camera.updateMatrixWorld();
    updateSea(cx, cz, t);

    updateLabels();
    hud();
    updateMission();
  }

  function spawnEnemy(spec) {
    const anchor = merchant && !merchant.dead ? merchant : player;
    let x = 0, z = 0, ok = false;
    for (let i = 0; i < 40 && !ok; i++) {
      const base = anchor === merchant && merchant.wp < route.length
        ? Math.atan2(route[merchant.wp].x - merchant.x, route[merchant.wp].z - merchant.z) : Math.random() * TAU;
      const a = base + (Math.random() - 0.5) * 2.8, r = 46 + Math.random() * 20;
      x = anchor.x + Math.sin(a) * r; z = anchor.z + Math.cos(a) * r;
      ok = Math.hypot(x, z) < ARENA - 8 && Math.hypot(x - ISL.x, z - ISL.z) > ISL.r + 6;
    }
    if (!ok) { const a = Math.random() * TAU; x = Math.sin(a) * 60; z = Math.abs(Math.cos(a)) * 60; }
    const e = createShip('e', x, z, Math.atan2(anchor.x - x, anchor.z - z));
    if (spec && spec.elite) {
      e.elite = true; e.group.scale.setScalar(1.35);
      e.maxHp = Math.round(e.maxHp * (spec.boss ? 5 : 3.5)); e.hp = e.maxHp;
      e.dmg *= 1.25; e.radius = 2.5; e.interval *= 0.85; e.maxSpeed *= 0.9;
      e.reward = Math.round(e.reward * (spec.boss ? 6 : 4)); e.level += 3;
      e.lab.hex.textContent = e.level; if (e.lab.rw) e.lab.rw.textContent = e.reward;
      addName(e, spec.boss ? '蛇王號' : ELITE_NAMES[Math.floor(Math.random() * ELITE_NAMES.length)]);
      e.lab.el.classList.add('elite');
    }
    return e;
  }
  function addName(s, text) {
    const nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = text;
    s.lab.el.insertBefore(nm, s.lab.el.firstChild);
  }

  const v3 = new THREE.Vector3();
  function updateLabels() {
    const top = 150, bottom = H - 130, mx = 28;
    const tag = $('portTag');
    if (legData && merchant && state !== 'menu') {
      v3.set(HARBOR.x, 3, HARBOR.z - 9).project(camera);
      const tx = (v3.x * 0.5 + 0.5) * W, ty = (-v3.y * 0.5 + 0.5) * H;
      const on = tx > 40 && tx < W - 40 && ty > 40 && ty < H - 40;
      tag.hidden = !on;
      if (on) tag.style.transform = 'translate3d(' + tx.toFixed(1) + 'px,' + ty.toFixed(1) + 'px,0) translate(-50%,-50%)';
    } else tag.hidden = true;
    for (const s of ships) {
      if (!s.lab || s.dead) continue;
      v3.set(s.x, 4.6, s.z).project(camera);
      const sx = (v3.x * 0.5 + 0.5) * W, sy = (-v3.y * 0.5 + 0.5) * H;
      s.lab.fill.style.transform = 'scaleX(' + clamp(s.hp / s.maxHp, 0, 1).toFixed(3) + ')';
      const off = sx < mx || sx > W - mx || sy < top - 60 || sy > H - 20;
      s.lab.el.style.display = off ? 'none' : '';
      if (!off) s.lab.el.style.transform = 'translate3d(' + sx.toFixed(1) + 'px,' + sy.toFixed(1) + 'px,0) translate(-50%,-100%)';
      if (s.arrow) {
        if (off) {
          const cxm = W / 2, cym = (top + bottom) / 2, hx = W / 2 - mx, hy = (bottom - top) / 2;
          const dx = sx - cxm, dy = sy - cym;
          const k = Math.min(hx / (Math.abs(dx) || 1), hy / (Math.abs(dy) || 1));
          const ax = cxm + dx * k, ay = cym + dy * k;
          s.arrow.style.display = '';
          s.arrow.style.transform = 'translate3d(' + (ax - 9).toFixed(1) + 'px,' + (ay - 9).toFixed(1) + 'px,0) rotate(' + Math.atan2(dy, dx).toFixed(3) + 'rad)';
        } else s.arrow.style.display = 'none';
      }
    }
  }

  /* ---------- loop ---------- */
  let last = performance.now();
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (state !== 'paused') update(dt);
    renderer.render(scene, camera);
  }

  player = createShip('p', 0, 28, Math.PI);
  update(0.016);
  showOverlay('menu');
  requestAnimationFrame(frame);
})();
</script>
